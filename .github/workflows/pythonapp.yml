name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install TA-Lib C library
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/ta-lib_0.6.4_amd64.deb https://github.com/TA-Lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/ta-lib_0.6.4_amd64.deb
          sudo ldconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mypy==1.19.1" "ruff==0.14.1" pytest

      - name: Install ta-lib and vnpy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install "ta-lib==0.6.4" --index-url https://pypi.vnpy.com
          else
            python -m pip install "ta-lib==0.6.4"
          fi
          python -m pip install "vnpy==4.4.0"

      - name: Install IB API pythonclient
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/twsapi_macunix.1045.01.zip" "https://interactivebrokers.github.io/downloads/twsapi_macunix.1045.01.zip"
          python -m zipfile -e "$RUNNER_TEMP/twsapi_macunix.1045.01.zip" "$RUNNER_TEMP/twsapi"
          python -m pip install "$RUNNER_TEMP/twsapi/IBJts/source/pythonclient"

      - name: Install package
        run: pip install -e .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy vnpy_ib

      - name: Test
        run: python -m pytest tests
